name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
  ACTIONS_CACHE_SEGMENT_SIZE: 64000000 # 64MB segments
  ZSTD_CLEVEL: 1

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Run format check
        run: pnpm format:check

      - name: Run linting
        run: pnpm lint:check

      - name: Check theme files match the theme tokens
        run: pnpm theme:check

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Run type checking
        run: pnpm tsc

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Run tests
        run: pnpm test --coverage

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Run build
        run: pnpm build

      - name: Check published packages
        run: pnpm lint:packages

  knip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Find unused files, exports and dependencies
        run: pnpm knip

  jscpd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Find copy-pasted code
        run: pnpm jscpd

      - name: Find types that repeat the types package
        run: pnpm dup:types

  ui-against-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Typecheck ui against types and data published on npm
        run: pnpm ui:npm

  storybook-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Install Chromium
        run: pnpm --filter @evilmartians/agent-prism-storybook exec playwright install --with-deps chromium

      - name: Run stories with interaction and accessibility checks
        run: pnpm test:storybook

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Find changed data sources
        id: changed
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=d "$BASE_REF...HEAD" -- 'packages/data/src/*.ts' \
            | { grep -Ev '\.test\.ts$|/test-utils/|/create-mock-' || true; } \
            | sed 's|^packages/data/||' \
            | paste -sd, -)
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Mutating: ${files:-no changed data sources}"

      - name: Mutate changed data sources
        id: mutate
        if: steps.changed.outputs.files != ''
        continue-on-error: true
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: pnpm mutate --mutate "$FILES"

      - name: Write the mutation report to the job summary
        if: steps.mutate.outcome == 'success'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          pnpm --silent mutation:report "$BASE_REF" > "$RUNNER_TEMP/mutation.md"
          cat "$RUNNER_TEMP/mutation.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the mutation report on the pull request
        if: steps.mutate.outcome == 'success' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq 'map(select(.body | startswith("<!-- mutation-report -->"))) | first | .id // empty')
          if [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" -X PATCH -F body=@"$RUNNER_TEMP/mutation.md" >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/mutation.md" >/dev/null
          fi

  main:
    if: always()
    needs:
      [
        lint,
        typecheck,
        test,
        build,
        knip,
        jscpd,
        ui-against-npm,
        storybook-test,
        mutation,
      ]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check that all jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  deploy-storybook:
    if: ${{ !cancelled() && needs.main.result == 'success' && github.ref == 'refs/heads/main' }}
    needs: [main]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Build Storybook
        run: pnpm --filter @evilmartians/agent-prism-storybook build

      - name: Deploy Storybook to Firebase
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_AGENT_TRACE_UI }}"
          projectId: agent-prism-ui
          channelId: live
          target: agent-prism-ui
